name: SIGAPI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigapi_test
          POSTGRES_USER: test_app
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_app -d sigapi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run Python suite
        env:
          TEST_DATABASE_URL: postgresql://test_app:ci-test-password@127.0.0.1:5432/sigapi_test
        run: python -m unittest discover -s tests -v

  node-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node --test openclaw-plugin/index.test.js openclaw-plugin/intake.test.js
      - run: node --check openclaw-plugin/index.js

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [public-web, admin-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  playwright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [public-web, admin-web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.ci config

  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file .env.ci --profile test build tests
      - run: docker compose --env-file .env.ci --profile test run --rm tests python -m backend.manage migrate
      - run: docker compose --env-file .env.ci --profile test run --rm tests python -m backend.manage migrate
      - if: always()
        run: docker compose --env-file .env.ci --profile test down -v
