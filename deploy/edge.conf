server {
    listen 80;
    server_name _;
    root /srv/www;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://web:8012;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; media-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location ~ /\. { return 404; }
    location /api/ {
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 40s;
        proxy_request_buffering on;
    }
    location = /healthz { proxy_pass $web_upstream; }
    location = /admin { return 301 /admin/; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
    access_log off;
}
